spring.application.name=hostel-management-system
server.port=${PORT:8080}

# Default: in-memory H2 (zero setup). Use  --spring.profiles.active=mysql  for MySQL.
spring.datasource.url=jdbc:h2:mem:hostel;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:aG9zdGVsLW1hbmFnZW1lbnQtc3lzdGVtLXNlY3JldC1rZXktY2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tMjAyNg==}
app.jwt.expiration-ms=86400000
